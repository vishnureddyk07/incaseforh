services:
  - type: web
    name: incaseforh
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm run server
    envVars:
      - key: NODE_ENV
        value: production
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
      - key: MSG91_DEFAULT_COUNTRY_CODE
        value: "91"
