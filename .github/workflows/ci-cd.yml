name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Run npm ci
        run: npm ci
        working-directory: .

      - name: Run npm ci in client
        run: npm ci
        working-directory: client

      - name: Run npm run build in client
        run: npm run build
        working-directory: client

      - name: Run npx vitest --run in client
        run: npx vitest --run
        working-directory: client

  post-commit-status:
    name: Post Commit Status
    runs-on: ubuntu-latest
    needs: build-and-test
    if: always()

    steps:
      - name: Post success or failure status
        uses: actions/github-script@v7
        with:
          script: |
            const result = "${{ needs.build-and-test.result }}";
            const state = result === "success" ? "success" : "failure";
            const sha = context.eventName === "pull_request"
              ? context.payload.pull_request.head.sha
              : context.sha;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state,
              context: "ci-cd/pipeline",
              description: state === "success" ? "CI/CD checks passed" : "CI/CD checks failed",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
