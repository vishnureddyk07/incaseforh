name: Weekly Backup CI

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test -- --run

  post-commit-status:
    name: Post Commit Status
    runs-on: ubuntu-latest
    needs: build-and-test
    if: always()

    steps:
      - name: Publish build/test commit status
        uses: actions/github-script@v7
        with:
          script: |
            const result = "${{ needs.build-and-test.result }}";
            const state = result === "success" ? "success" : "failure";
            const description =
              state === "success"
                ? "Weekly backup workflow succeeded"
                : "Weekly backup workflow failed";

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "weekly-backup-ci",
              description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
